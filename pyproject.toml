[tool.black]
# Black's settings for code formatting
line-length = 88  # Black's default line length
target-version = ['py39']  # Adjust for your Python version (3.13.1 in your case, but py39 should be fine)
skip-string-normalization = true  # Avoid changes to quotes (single vs double)

[tool.flake8]
# Flake8 settings for linting
max-line-length = 88  # Must align with Black's line length
extend-ignore = ["E203"]  # Ignore the E203 error (conflict with Black's settings)
exclude = [
    ".git",
    "__pycache__",
    "venv",
    "tests"
]  # Exclude directories to prevent linting unnecessary files

[tool.isort]
# Isort settings for import sorting
profile = "black"  # Ensures compatibility with Black's formatting
known_third_party = ["requests", "pandas"]  # Common third-party packages
known_first_party = ["my_project"]  # Replace with your project name or modules
line_length = 88  # Align with Black's line length

[tool.pytest.ini_options]
# Pytest settings for testing
maxfail = 5  # Stop after 5 failed tests
disable-warnings = true  # Disable warnings in test output
addopts = "--tb=short"  # Short traceback for errors (cleaner output)

[coverage:run]
# Coverage collection settings
branch = true  # Track branch coverage (important for full test coverage)
source = 
    "my_project"  # Replace with your project name or module
    "tests"  # Include tests in coverage

[coverage:report]
# Coverage reporting settings
show_missing = true  # Show missing lines in the report
skip_covered = true  # Skip fully covered files in the report
